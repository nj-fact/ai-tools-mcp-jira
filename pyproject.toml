[project]
name = "jira-agent"
version = "0.1.0"
description = "Small local Jira API tool for Codex, Claude Code, and future MCP use."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastmcp>=3.4.2",
    "httpx>=0.28.1",
    "pydantic>=2.11.0",
    "python-dotenv>=1.1.0",
    "rich>=14.0.0",
    "typer>=0.16.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.4.0",
    "ruff>=0.12.0",
]

[project.scripts]
jira-agent = "jira_agent.cli:app"
jira-agent-mcp = "jira_agent.mcp_server:main"

[dependency-groups]
dev = [
    "pytest>=8.4.0",
    "ruff>=0.12.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# PLW0129 only, not PL wholesale: the rest of pylint is noisy here, and this single rule catches
# the class of defect where an assertion is a bare truthy literal and therefore never runs.
select = ["E", "F", "I", "UP", "B", "PLW0129"]
